name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repo or posts comments, so the
# default broad token scope is unnecessary.
permissions:
  contents: read

# A new push to the same branch supersedes the in-flight run instead of queueing
# behind it. Pure latency; without it a push-during-CI waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── static gates ──────────────────────────────────────────────────────────
  # No nix, no devenv, no multi-minute build. Runs while the other jobs are
  # still downloading their toolchain, so a typo fails in seconds instead of
  # after the expensive jobs finish.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck the bootstrap script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          # -s sh: POSIX sh, not bash. The script runs under dash on Ubuntu, so
          # bash-only constructs would pass here and die on a student's machine.
          shellcheck -s sh scripts/start.sh && echo "  start.sh lint OK"

      - name: Vimrc parses cleanly
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vim
          vim -Nu deploy/vimrc -n -es -c 'qa!' && echo "  deploy/vimrc OK"

      # actionlint is the one check here that carries the real GitHub Actions
      # schema plus expression/context validation, and it has already caught
      # three bugs that plain YAML parsing cannot see (hashFiles() in a
      # job-level env, a job name containing ": ", and a step mixing run: with
      # parallel:). It is deliberately in the fast job, not the slow one, so a
      # workflow mistake costs seconds instead of minutes.
      #
      # Uses actionlint's own download script rather than apt (not packaged) or
      # Nix (this job stays Nix-free on purpose). Pinned to an explicit version
      # so a new upstream release cannot change verdicts under us.
      - name: Install actionlint
        id: get_actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
        shell: bash

      - name: Lint the workflow files
        run: |
          # The matcher turns actionlint's output into clickable annotations on
          # the PR diff instead of a wall of text in the log.
          echo "::add-matcher::.github/actionlint-matcher.json"
          "${{ steps.get_actionlint.outputs.executable }}" -color
        shell: bash

  # ── the faithful reproduction of the student's actual path ────────────────
  # This is the job that matters. It starts from a completely blank Windows
  # runner, installs WSL, installs the specific Ubuntu version the competition
  # specifies, and runs the student's command from inside that WSL. Everything
  # the student actually hits is exercised here: the IS_WSL branch, the /mnt/c
  # interop used to find the Windows profile, the .wslconfig write to the
  # Windows filesystem, and the absence of a TTY (so the shell entry has to
  # fall back to printing instructions rather than exec'ing /dev/tty).
  #
  # There is deliberately no separate native-Linux job doing the same checks:
  # it would pass while this one failed, which reads as a flake rather than a
  # real WSL bug, and the two would race to save the same nix cache key. `lint`
  # covers the fast-fail case, and this job rebuilds from a cold store in a few
  # minutes, which is acceptable here.
  wsl:
    name: "WSL — blank Windows → install Ubuntu-${{ matrix.ubuntu }} → run the student command in WSL"
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # 24.04 is the competition spec series. Testing a second version would
        # only prove the distro installs, not that the toolchain matches, so
        # there is deliberately only one.
        ubuntu:
          - '24.04'
    steps:
      - name: Install WSL
        uses: Ubuntu/WSL/.github/actions/wsl-install@main
        with:
          # Canonical's own action. Installs WSL and this exact distro with
          # `wsl.exe --install <distro> --web-download --no-launch`, so there is
          # no interactive "create a UNIX username" prompt to get stuck on —
          # which is what made the hand-rolled approach unusable in CI.
          #
          # Known-benign noise: its first step runs `winget install WSL` with
          # continue-on-error, because WSL is usually already present on the
          # runner image. winget then exits 1 and the action logs it as
          # "##[error]Process completed with exit code 1" while still marking
          # the step a success. Ignore that annotation; the distro install in
          # the next step is the one that has to succeed, and it reports
          # "Distribution successfully installed" / "Created a new distro with
          # user: root".
          #
          # Note the user is root: the runner's WSL image has no OOBE user.
          # Nothing here depends on being non-root — the only sudo-requiring
          # steps start.sh performs are printed, not executed — so this matches
          # the student path closely enough to be worth trusting.
          distro: Ubuntu-${{ matrix.ubuntu }}

      - name: Assert the distro is the competition spec
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          exec: |
            set -eu
            echo "── distro identity ──"
            lsb_release -ds
            # `lsb_release -rs` gives the SERIES only ("24.04"), never the point
            # release, so it cannot be used to check for 24.04.2 specifically.
            # The point release lives in /etc/os-release's VERSION.
            series="$(lsb_release -rs)"
            point="$(. /etc/os-release && echo "$VERSION")"
            echo "  series: $series   point release: $point"

            case "$series" in
              24.04) echo "  24.04 series OK" ;;
              *) echo "  FAIL: expected the 24.04 series, got $series"; exit 1 ;;
            esac

            # Note the discrepancy rather than assert it away, and do not try to
            # chase it: `wsl --install -d Ubuntu-24.04` is the student's command
            # and it has no version selector — it installs whatever Canonical
            # last put in the Store. Right now that is 24.04.5, not the 24.04.2
            # the spec names, and there is no image to import instead:
            # cloud-images.ubuntu.com/wsl/releases/noble/ publishes only
            # 20240423/ (= 24.04.0) and current/, and Canonical's own
            # release-info tooling has no version flag.
            #
            # The series is asserted because that is what is enforceable. The
            # point release is not, and does not need to be: the judge compiles
            # with its own gcc 13.3.0, and ours comes from the nixpkgs pin
            # rather than apt. If this ever starts to matter, the pin is what
            # has to move, not this check.
            case "$point" in
              *24.04.2*) echo "  point release matches the spec exactly" ;;
              *) echo "  note: store image is $point, spec names 24.04.2 — not installable, and irrelevant (compiler is nix-pinned)" ;;
            esac

      # NOTE: no nix-store caching here. cache-nix-action documents that it
      # supports only Linux and macOS runners, and it has to be: on Windows it
      # would look for /nix on the host, whereas the store lives inside the WSL
      # distro and is invisible to the host filesystem. Attempting it fails with
      # "At least one directory or file path is required". Hand-tarring /nix out
      # of WSL to work around this is not worth it — a cold store costs a few
      # minutes per run on a repo nobody else is pushing to.

      - name: Clone the repo inside WSL
        uses: Ubuntu/WSL/.github/actions/wsl-checkout@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env

      - name: Run the student's command inside WSL
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            export IOI_ENV_NO_SHELL=1   # no TTY under wsl.exe; skip the shell
            bash scripts/start.sh

      # ── WSL-specific assertions ───────────────────────────────────────────
      # These are the things that can only be true when the code really ran
      # inside WSL, so they are what separates this job from the native one.
      - name: Assert the WSL-only behaviour actually fired
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            fail=0

            echo "── IS_WSL branch was taken ──"
            if grep -qi microsoft /proc/sys/kernel/osrelease; then
              echo "  running under the WSL2 kernel OK"
            else
              echo "  FAIL: not under the WSL2 kernel — the WSL path was not exercised"; fail=1
            fi

            echo "── .wslconfig reached the Windows filesystem ──"
            # The script finds the Windows profile through /mnt/c + cmd.exe
            # interop, then writes .wslconfig there. On a bare runner that file
            # does not exist yet, so its presence proves the interop worked.
            winuser="$(/mnt/c/Windows/System32/cmd.exe /c 'echo %USERNAME%' 2>/dev/null | tr -d '\r')"
            cfg="/mnt/c/Users/${winuser}/.wslconfig"
            if [ -f "$cfg" ]; then
              echo "  wrote $cfg OK"
              grep -q 'memory=' "$cfg" || { echo "  FAIL: .wslconfig has no memory pin"; fail=1; }
              grep -q 'processors=' "$cfg" || { echo "  FAIL: .wslconfig has no processor pin"; fail=1; }
            else
              echo "  FAIL: $cfg not written — Windows interop broke"; fail=1
            fi

            echo "── idempotent, and no TTY handled gracefully ──"
            # Two things at once. The exit code proves start.sh does not die when
            # /dev/tty cannot be opened (it used to exec it unconditionally and
            # exit non-zero, which reads as "the install failed"). Running it a
            # SECOND time proves the whole path is idempotent: vimrc already
            # installed, .wslconfig already present, repo already cloned — none of
            # which may be an error.
            if IOI_ENV_NO_SHELL=1 bash scripts/start.sh >/dev/null 2>&1; then
              echo "  second run exits 0 with no TTY OK"
            else
              echo "  FAIL: start.sh is not idempotent, or exits non-zero with no TTY"; fail=1
            fi

            [ "$fail" = 0 ] || exit 1

      # ── paths a real student hits that a fresh runner never does ───────────
      # Everything above runs on a virgin machine. A student's machine is not
      # virgin: they already have a ~/.vimrc, they already have a .wslconfig,
      # they already have opinions. Those branches were completely untested,
      # and a bug in "leave the user's file alone" is exactly the kind that
      # destroys someone's existing config.
      - name: Do not clobber a pre-existing vimrc or .wslconfig
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            # Plant sentinels that must survive verbatim.
            printf 'SENTINEL_VIMRC_DO_NOT_TOUCH\n' > "$HOME/.vimrc"
            cfgd="/mnt/c/Users/runneradmin/.wslconfig"
            printf '[wsl2]\nmemory=3GB\nSENTINEL_WSL_CONFIG\n' > "$cfgd"

            IOI_ENV_NO_SHELL=1 bash scripts/start.sh >/dev/null 2>&1
            echo "  re-ran start.sh with pre-existing files"

            grep -qx 'SENTINEL_VIMRC_DO_NOT_TOUCH' "$HOME/.vimrc" \
              || { echo "  FAIL: ~/.vimrc was overwritten"; exit 1; }
            echo "  ~/.vimrc left untouched OK"

            grep -qx 'SENTINEL_WSL_CONFIG' "$cfgd" \
              || { echo "  FAIL: .wslconfig was overwritten"; exit 1; }
            grep -qx 'memory=3GB' "$cfgd" \
              || { echo "  FAIL: .wslconfig memory was rewritten"; exit 1; }
            echo "  .wslconfig left untouched OK (user's memory=3GB preserved)"

      # The fetch path. wsl-checkout pre-populates ~/ioi-env, so start.sh's own
      # fetch never ran anywhere in this job — meaning the code that clones or
      # downloads the repo was untested inside WSL, which is the only place it
      # matters for students.
      - name: start.sh can fetch the repo itself, inside WSL
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          exec: |
            set -eu
            dest="$HOME/ioi-env-fetched"
            rm -rf "$dest"
            IOI_ENV_DIR="$dest" IOI_ENV_NO_SHELL=1 \
              bash ~/ioi-env/scripts/start.sh >/dev/null 2>&1
            test -f "$dest/devenv.nix" \
              || { echo "  FAIL: start.sh did not fetch a working repo"; exit 1; }
            test -f "$dest/Justfile" \
              || { echo "  FAIL: fetched repo has no Justfile"; exit 1; }
            echo "  fetched into $dest OK"

      # The memory value must be derived from the host, never hard-coded. A
      # fixed 8GB is fine on this runner and starves Windows on a 4GB laptop.
      - name: .wslconfig memory is derived from the host, not hard-coded
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            ps=/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
            total=$("$ps" -NoProfile -Command "(Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory" 2>/dev/null \
                    | tr -d '\r' | grep -E '^[0-9]+$' | head -1)
            total_gb=$(( total / 1024 / 1024 / 1024 ))
            echo "  host: ${total_gb}GB"

            # bootstrap writes the file only when absent, so clear the sentinel
            # planted above and let the recipe compute a value.
            rm -f /mnt/c/Users/runneradmin/.wslconfig
            IOI_ENV_NO_SHELL=1 bash scripts/start.sh >/dev/null 2>&1
            cfg=/mnt/c/Users/runneradmin/.wslconfig
            test -f "$cfg" || { echo "  FAIL: .wslconfig not written"; exit 1; }

            written=$(grep -E '^memory=' "$cfg" | head -1 | cut -d= -f2 | tr -d 'GBgG ')
            echo "  wrote memory=${written}GB"
            [ "$written" -gt 0 ] 2>/dev/null || { echo "  FAIL: unparseable memory value"; exit 1; }
            [ "$written" -le $(( total_gb / 2 )) ] \
              || { echo "  FAIL: ${written}GB exceeds half the host's ${total_gb}GB"; exit 1; }
            [ "$written" -ge 2 ] \
              || { echo "  FAIL: ${written}GB is below the 2GB floor"; exit 1; }
            echo "  memory is half the host, within [2GB, 8GB] OK"


      - name: Verify the toolchain inside WSL
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            . ~/ioi-env/scripts/ci-wsl-env.sh
            devenv shell --no-tui -- just check-env
            devenv shell --no-tui -- just check-compile
            devenv shell --no-tui -- just check-vimrc

      - name: Sanitizers stable under the WSL2 kernel
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            . ~/ioi-env/scripts/ci-wsl-env.sh
            # Ran as its own step rather than folded into the verify step above,
            # because WSL2 is a different kernel with a different ASLR situation
            # from a native Linux runner, and this is the run that proves
            # `setarch -R` is still load-bearing here rather than cargo-culted.
            devenv shell --no-tui -- just check-asan

  # ── the literal one-liner, straight off GitHub ──────────────────────────────
  # The WSL job clones the repo itself; this one runs the exact curl command
  # from the README, against the published branch, to prove the URL in the docs
  # really is a working one-liner and that a default install lands in
  # ~/ioi-env as documented. Only meaningful on main, where that branch is the
  # one being pushed — a PR's head ref doesn't exist on the base repo, so the
  # published-main URL would 404 for reasons unrelated to the script.
  oneliner-remote:
    name: one-liner (curl | bash) from published main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Run the README one-liner verbatim
        env:
          IOI_ENV_NO_SHELL: "1"
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/start.sh" | bash

      - name: It landed in ~/ioi-env with a working toolchain
        run: |
          test -f "$HOME/ioi-env/devenv.nix" || { echo "  FAIL: did not install to ~/ioi-env"; exit 1; }
          cd "$HOME/ioi-env"
          devenv allow
          devenv shell --no-tui -- just check-env
