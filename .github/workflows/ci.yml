name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repo or posts comments, so the
# default broad token scope is unnecessary.
permissions:
  contents: read

# A new push to the same branch supersedes the in-flight run instead of queueing
# behind it. Pure latency; without it a push-during-CI waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── static gates ──────────────────────────────────────────────────────────
  # No nix, no devenv, no multi-minute build. Runs while the bootstrap job is
  # still downloading its toolchain, so a typo fails in seconds instead of
  # after the expensive job finishes.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck the bootstrap script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          # -s sh: POSIX sh, not bash. The script runs under dash on Ubuntu, so
          # bash-only constructs would pass here and die on a student's machine.
          shellcheck -s sh scripts/start.sh && echo "  start.sh lint OK"

      - name: Vimrc parses cleanly
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vim
          vim -Nu deploy/vimrc -n -es -c 'qa!' && echo "  deploy/vimrc OK"

      - name: devenv.nix parses
        run: nix-instantiate --parse devenv.nix >/dev/null && echo "  devenv.nix OK"

  # ── the real test ─────────────────────────────────────────────────────────
  # Runs the actual bootstrap script on a clean runner: no Nix, no devenv, no
  # git config — exactly the state of a student's fresh WSL Ubuntu. ubuntu-24.04
  # is not incidental, it IS the spec: the contest environment is Ubuntu 24.04.2,
  # and this job exists to prove the one-liner works on a brand-new copy of it.
  # The second OS is there to prove the pin survives a newer base image.
  bootstrap:
    name: bootstrap on a clean ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          # The spec IS ubuntu-24.04.2, so this is the one that must pass.
          # (ubuntu-26.04 is listed in GitHub's docs as an available runner but
          # is not in actionlint's label set — an unknown label makes the whole
          # workflow fail to parse, so it is not worth the risk here.)
          - ubuntu-24.04
    env:
      # Job-level so the `parallel` group below can see it: a step-scoped env is
      # invisible to every step after the one that set it.
      # NOTE: only github/inputs/matrix/needs/secrets/strategy/vars are legal in
      # a job-level env — `runner.temp` is not one of them, and using it makes
      # the whole workflow fail to parse with zero jobs created.
      IOI_ENV_DIR: ${{ github.workspace }}/ioi-env
      IOI_ENV_REPO: https://github.com/${{ github.repository }}
      IOI_ENV_BRANCH: ${{ github.ref_name }}
      IOI_ENV_NO_SHELL: "1"   # CI has no TTY; skip the interactive shell
    steps:
      - uses: actions/checkout@v7

      # devenv.lock is the input pin; hashing it means a cache hit for every
      # commit that doesn't touch the pin, and automatic invalidation when one
      # does. Without this the nix store is cold on every run.
      - name: Restore nix store cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.os }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}
          restore-prefixes-fallback: nix-${{ matrix.os }}-

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Run the bootstrap script
        run: bash scripts/start.sh

      - name: Trust the fetched project
        run: cd "$IOI_ENV_DIR" && devenv allow

      # ── parallel verification ─────────────────────────────────────────────
      # Each of these is a `just` recipe, so the student, this CI job, and the
      # pre-push hook all execute the same code. They used to run one after
      # another inside a single shell; `parallel` runs them as concurrent
      # background steps and keeps each one's log separate instead of
      # interleaving them the way `&` in a shell would.
      #
      # The group is bounded by the same 10-concurrent-step limit as any
      # background step; five is well inside it.
      # ── verification ───────────────────────────────────────────────────────
      # Each of these is a `just` recipe, so the student, this CI job, and the
      # pre-push hook all execute the same code — that is the point, not speed.
      #
      # These are sequential on purpose. GitHub's new step-level `parallel:`
      # was tried first and removed: it saves roughly 75s in a job that takes
      # minutes, and it costs the ability to validate the file cleanly —
      # actionlint 1.7.12 is the latest upstream release and still predates that
      # keyword, so accepting `parallel:` means either ignoring one of its rules
      # or losing the context-availability checks that caught a real bug here.
      # The parallelism that pays is at job level, which this already has: lint,
      # bootstrap, and oneliner-remote all run concurrently.
      - name: Verify versions and std-guard
        run: |
          cd "$IOI_ENV_DIR"
          devenv shell --no-tui -- just check-env

      - name: Verify C++17 compiles, C++23 rejected
        run: |
          cd "$IOI_ENV_DIR"
          devenv shell --no-tui -- just check-compile

      - name: Verify sanitizers deterministic
        run: |
          cd "$IOI_ENV_DIR"
          devenv shell --no-tui -- just check-asan

      - name: Verify vimrc parses and keeps its guards
        run: |
          cd "$IOI_ENV_DIR"
          devenv shell --no-tui -- just check-vimrc

      - name: Verify the vimrc bootstrap actually installed
        run: |
          test -f "$HOME/.vimrc" || { echo "  FAIL: ~/.vimrc not installed by bootstrap"; exit 1; }
          vim -Nu "$HOME/.vimrc" -n -es -c 'qa!' && echo "  ~/.vimrc sources cleanly OK"
          grep -q 'setarch' "$HOME/.vimrc" || { echo "  FAIL: installed vimrc lost the setarch guard"; exit 1; }
          grep -q 'std=c++17' "$HOME/.vimrc" || { echo "  FAIL: installed vimrc no longer targets C++17"; exit 1; }

      - name: Save nix store cache
        if: github.ref == 'refs/heads/main'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.os }}-${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}

  # ── the literal one-liner, straight off GitHub ──────────────────────────────
  # The job above sets IOI_ENV_DIR to a temp path; this one runs the exact curl
  # command from the README, against the published branch, to prove the URL in
  # the docs really is a working one-liner and that a default install lands in
  # ~/ioi-env as documented. Only meaningful on main, where that branch is the
  # one being pushed — a PR's head ref doesn't exist on the base repo, so the
  # published-main URL would 404 for reasons unrelated to the script.
  oneliner-remote:
    name: one-liner (curl | bash) from published main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Run the README one-liner verbatim
        env:
          IOI_ENV_NO_SHELL: "1"
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/start.sh" | bash

      - name: It landed in ~/ioi-env with a working toolchain
        run: |
          test -f "$HOME/ioi-env/devenv.nix" || { echo "  FAIL: did not install to ~/ioi-env"; exit 1; }
          cd "$HOME/ioi-env"
          devenv allow
          devenv shell --no-tui -- just check-env
