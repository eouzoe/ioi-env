name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 靜態檢查。沒有 nix、沒有 devenv，幾秒就跑完，錯字在這裡就擋下。
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # -s sh：POSIX sh 不是 bash。腳本在 Ubuntu 上用 dash 跑，
          # bash-only 寫法在這裡會過、在學生機器上會死。
          shellcheck -s sh scripts/start.sh && echo "  start.sh lint OK"

      - name: Install actionlint
        id: get_actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
        shell: bash

      # actionlint 帶真的 GitHub Actions schema + 語意檢查。它抓過 job-level env
      # 用了 runner context、job name 含 ": "、step 混用 run: 與 parallel: ——
      # 任一個都讓整個 workflow 零 job 失敗，而 GitHub 只說 "workflow file issue"。
      - name: Lint the workflow
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          "${{ steps.get_actionlint.outputs.executable }}" -color
        shell: bash

  # 真正重要的 job：從完全空白的 Windows runner 開始，裝 WSL、裝指定的
  # Ubuntu 版本，然後在 WSL 裡面跑學生那一行。只有這裡會碰到 WSL 特有的路徑。
  wsl:
    name: "WSL: blank Windows → install Ubuntu-${{ matrix.ubuntu }} → run the student command in WSL"
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 24.04 是規格系列。多測一版只會證明發行版裝得起來，不會證明工具鏈對。
        ubuntu:
          - '24.04'
    # NOTE: repo/branch for start.sh's own fetch is resolved per-step below,
    # because hashFiles()-style env resolution is only legal in step-level
    # contexts and the expressions here reference github.event.
    # NOTE: job-level env is NOT visible inside WSL. wsl-bash is a PowerShell
    # composite action that pipes the exec script into `bash script.sh`, and only
    # variables exported inside that script survive. (Learned the hard way: a
    # run hung for 30 minutes because IOI_ENV_NO_SHELL was only set here, so
    # start.sh fell through to `exec devenv shell` and waited forever on a TTY.)
    env:
      IOI_ENV_NO_SHELL: "1"
    steps:
      # Canonical 自己的 action：`wsl.exe --install <distro> --web-download
      # --no-launch`，所以不會卡在「建立 UNIX 使用者」的互動提示——那就是手刻
      # 安裝流程在 CI 裡不可用的原因。
      #
      # 有個已知的良性噪音：它的第一步用 continue-on-error 跑 winget install
      # WSL，而 runner 映像通常已裝，winget 於是 exit 1 並被記成
      # "##[error]Process completed with exit code 1"，但步驟本身算成功。
      # 忽略它；要成功的是下一步的 distro 安裝。
      - name: Install WSL
        uses: Ubuntu/WSL/.github/actions/wsl-install@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}

      # `lsb_release -rs` 只給系列（"24.04"），不給 point release，所以不能拿它
      # 檢查 24.04.2。point release 在 /etc/os-release 的 VERSION。
      #
      # 系列要斷言（這是可執行的），point release 不斷言也不該追：Store appx 沒
      # 版本選項、cloud-images 只有 20240423/ 與 current/、Canonical 自己的工具
      # 也沒有版本參數。而 judge 用它自己的 gcc 13.3.0，我們的是 nix 釘的，
      # 發行版 point release 不影響提交。
      - name: Assert the distro is the spec series
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          exec: |
            set -eu
            lsb_release -ds
            series="$(lsb_release -rs)"
            point="$(. /etc/os-release && echo "$VERSION")"
            echo "  series: $series   point release: $point"
            case "$series" in
              24.04) echo "  24.04 series OK" ;;
              *) echo "  FAIL: expected 24.04, got $series"; exit 1 ;;
            esac

      - name: Clone the repo inside WSL
        uses: Ubuntu/WSL/.github/actions/wsl-checkout@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env

      - name: Run the student's command inside WSL
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          # wsl-bash 只接受 distro/exec/working-dir，env 要在腳本裡 export。
          # 抓 **這個 commit**，不是遠端 main：少了它，PR 上跑的是已發布的舊碼，
          # 綠色完全沒有意義，而你以為改動被驗證過了。
          # fork PR 的 head 只在 fork 上，base repo 抓不到，所以用 head.repo。
          exec: |
            set -eu
            # NO_SHELL is load-bearing: without it start.sh execs `devenv shell`
            # and blocks forever, because there is no TTY under wsl.exe.
            export IOI_ENV_NO_SHELL=1
            export IOI_ENV_REPO="https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}"
            export IOI_ENV_BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
            bash scripts/start.sh

      # 學生已經有 ~/.vimrc 時不能被覆蓋——那對他來說是救不回來的。
      # 放哨兵、重跑、要求逐位元組存活。
      - name: Never clobber a pre-existing ~/.vimrc
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            # 備份真的 vimrc 再還原。少了這步，哨兵會留下來，後面讀按鍵的步驟
            # 就拿到一個沒有映射的空檔而失敗——那是我自己造成的假失敗。
            cp "$HOME/.vimrc" "$HOME/.vimrc.real"
            printf 'SENTINEL_DO_NOT_TOUCH\n' > "$HOME/.vimrc"
            IOI_ENV_NO_SHELL=1 bash scripts/start.sh >/dev/null 2>&1
            grep -qx 'SENTINEL_DO_NOT_TOUCH' "$HOME/.vimrc" \
              || { mv "$HOME/.vimrc.real" "$HOME/.vimrc"; echo "  FAIL: ~/.vimrc was overwritten"; exit 1; }
            mv "$HOME/.vimrc.real" "$HOME/.vimrc"
            echo "  ~/.vimrc left untouched OK (real vimrc restored)"

      # start.sh 自己抓 repo 的路徑。wsl-checkout 已先把 repo 放好，所以這段程式碼
      # 在這個 job 裡從未跑過——而它是學生唯一會走的路。
      - name: start.sh can fetch the repo itself, inside WSL
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          # 同上：這個 step 也要抓 PR 自己的碼，不是已發布的 main。
          exec: |
            set -eu
            export IOI_ENV_NO_SHELL=1
            export IOI_ENV_REPO="https://github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}"
            export IOI_ENV_BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
            dest="$HOME/ioi-env-fetched"
            rm -rf "$dest"
            IOI_ENV_DIR="$dest" bash ~/ioi-env/scripts/start.sh >/dev/null 2>&1
            test -f "$dest/devenv.nix" || { echo "  FAIL: did not fetch a working repo"; exit 1; }
            test -f "$dest/Justfile" || { echo "  FAIL: fetched repo has no Justfile"; exit 1; }
            echo "  fetched into $dest OK"

      - name: Verify the toolchain inside WSL
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            . ~/ioi-env/scripts/ci-wsl-env.sh
            just check-env

      # vimrc 不只是要 parse 過，按鍵必須真的存在——之前出過一版 F6/F8/F9 讀
      # input.txt 但沒人建立它，學生按了静靜失敗。
      - name: The vimrc's keys actually exist
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            sudo apt-get update -qq && sudo apt-get install -y vim
            vim -Nu "$HOME/.vimrc" -n -es -c 'qa!' && echo "  ~/.vimrc loads OK"
            maps=$(vim -Nu "$HOME/.vimrc" -n -es \
                   -c 'redir! > /dev/stdout | silent nmap <F5> | silent nmap <F6> | silent nmap <F7> | silent nmap <F8> | silent nmap <Leader>d | redir END' \
                   -c 'qa!' 2>/dev/null || true)
            n=$(printf '%s' "$maps" | grep -c 'g++')
            [ "$n" -ge 5 ] || { echo "  FAIL: only $n of 5 compile/debug keys mapped"; exit 1; }
            echo "  all $n compile/debug keys mapped OK"

      # zsh + oh-my-zsh 必須真的載入，不只是裝著。
      - name: zsh and oh-my-zsh actually load
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            . ~/ioi-env/scripts/ci-wsl-env.sh
            out=$(zsh -i -c 'echo "ver=$ZSH_VERSION"; [ -f "$ZSH/oh-my-zsh.sh" ] && echo "omz=$ZSH" || echo "omz=MISSING"; echo "theme=$ZSH_THEME"' 2>&1 || true)
            echo "$out" | grep -v '^%' | grep -v '^$'
            echo "$out" | grep -q "ver=5" || { echo "  FAIL: not running zsh 5.x"; exit 1; }
            echo "$out" | grep -q "omz=/.*oh-my-zsh" || { echo "  FAIL: oh-my-zsh did not load"; exit 1; }
            echo "  zsh + oh-my-zsh load OK"

  # README 裡那一行 curl，對著已發布的 main 跑，證明文件裡的指令真的能用。
  oneliner-remote:
    name: one-liner (curl | bash) from published main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Run the README one-liner verbatim
        env:
          IOI_ENV_NO_SHELL: "1"
          # Against the code under review: on a PR, curl the PR's own branch in
          # the fork; on main, curl published main exactly as the README says.
          # A green run that only ever tested published main would miss every
          # regression introduced by the PR it is supposed to be gating.
          ONELINER_REF: ${{ github.event.pull_request.head.ref || 'main' }}
          ONELINER_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          ref="${ONELINER_REF}"
          repo="${ONELINER_REPO}"
          echo "  curl from $repo@$ref"
          curl -fsSL "https://raw.githubusercontent.com/${repo}/${ref}/scripts/start.sh" | bash

      - name: It landed in ~/ioi-env
        run: |
          test -f "$HOME/ioi-env/devenv.nix" || { echo "  FAIL: did not install to ~/ioi-env"; exit 1; }
          cd "$HOME/ioi-env" && devenv allow
          devenv shell --no-tui -- just check-env
