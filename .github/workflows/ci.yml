name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repo or posts comments, so the
# default broad token scope is unnecessary.
permissions:
  contents: read

# A new push to the same branch supersedes the in-flight run instead of queueing
# behind it. Pure latency; without it a push-during-CI waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── static gates ──────────────────────────────────────────────────────────
  # No nix, no devenv, no multi-minute build. Runs while the other jobs are
  # still downloading their toolchain, so a typo fails in seconds instead of
  # after the expensive jobs finish.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck the bootstrap script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          # -s sh: POSIX sh, not bash. The script runs under dash on Ubuntu, so
          # bash-only constructs would pass here and die on a student's machine.
          shellcheck -s sh scripts/start.sh && echo "  start.sh lint OK"

      - name: Vimrc parses cleanly
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vim
          vim -Nu deploy/vimrc -n -es -c 'qa!' && echo "  deploy/vimrc OK"

  # ── the faithful reproduction of the student's actual path ────────────────
  # This is the job that matters. It starts from a completely blank Windows
  # runner, installs WSL, installs the specific Ubuntu version the competition
  # specifies, and runs the student's command from inside that WSL. Everything
  # the student actually hits is exercised here: the IS_WSL branch, the /mnt/c
  # interop used to find the Windows profile, the .wslconfig write to the
  # Windows filesystem, and the absence of a TTY (so the shell entry has to
  # fall back to printing instructions rather than exec'ing /dev/tty).
  #
  # There is deliberately no separate native-Linux job doing the same checks:
  # it would pass while this one failed, which reads as a flake rather than a
  # real WSL bug, and the two would race to save the same nix cache key. `lint`
  # covers the fast-fail case, and this job rebuilds from a cold store in a few
  # minutes, which is acceptable here.
  wsl:
    name: "WSL — blank Windows → install Ubuntu-${{ matrix.ubuntu }} → run the student command in WSL"
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # 24.04 is the competition spec (Ubuntu 24.04.2). Testing a second
        # version here would only prove the distro installs, not that the
        # toolchain matches, so there is deliberately only one.
        ubuntu:
          - '24.04'
    steps:
      - name: Install WSL
        uses: Ubuntu/WSL/.github/actions/wsl-install@main
        with:
          # Canonical's own action. Installs WSL and this exact distro with
          # `wsl.exe --install <distro> --web-download --no-launch`, so there is
          # no interactive "create a UNIX username" prompt to get stuck on —
          # which is what made the hand-rolled approach unusable in CI.
          distro: Ubuntu-${{ matrix.ubuntu }}

      - name: Assert the distro is the competition spec
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          exec: |
            set -eu
            echo "── distro identity ──"
            lsb_release -ds
            # `lsb_release -rs` gives the SERIES only ("24.04"), never the point
            # release, so it cannot be used to check for 24.04.2 specifically.
            # The point release lives in /etc/os-release's VERSION.
            series="$(lsb_release -rs)"
            point="$(. /etc/os-release && echo "$VERSION")"
            echo "  series: $series   point release: $point"

            case "$series" in
              24.04) echo "  24.04 series OK" ;;
              *) echo "  FAIL: expected the 24.04 series, got $series"; exit 1 ;;
            esac

            # Note the discrepancy rather than assert it away: the competition
            # spec names Ubuntu 24.04.2, but the WSL store's Ubuntu-24.04 image
            # is currently 24.04.5. Point releases within a series share the
            # same package set and the same apt gcc, and in any case the
            # compiler here comes from the nixpkgs pin in devenv.yaml, not from
            # apt — so this is recorded for visibility, not enforced. If it ever
            # starts to matter, it is the pin that has to move, not this check.
            case "$point" in
              *24.04.2*) echo "  point release matches the spec exactly" ;;
              *) echo "  note: store image is $point, spec names 24.04.2 (nix-pinned compiler, so no drift)" ;;
            esac

      # NOTE: no nix-store caching here. cache-nix-action documents that it
      # supports only Linux and macOS runners, and it has to be: on Windows it
      # would look for /nix on the host, whereas the store lives inside the WSL
      # distro and is invisible to the host filesystem. Attempting it fails with
      # "At least one directory or file path is required". Hand-tarring /nix out
      # of WSL to work around this is not worth it — a cold store costs a few
      # minutes per run on a repo nobody else is pushing to.

      - name: Clone the repo inside WSL
        uses: Ubuntu/WSL/.github/actions/wsl-checkout@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env

      - name: Run the student's command inside WSL
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            export IOI_ENV_NO_SHELL=1   # no TTY under wsl.exe; skip the shell
            bash scripts/start.sh

      # ── WSL-specific assertions ───────────────────────────────────────────
      # These are the things that can only be true when the code really ran
      # inside WSL, so they are what separates this job from the native one.
      - name: Assert the WSL-only behaviour actually fired
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            # each wsl-bash step is a fresh non-login shell: nothing a previous
            # step exported is still set, so source the nix profile explicitly.
            for p in /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh \
                     /nix/var/nix/profiles/default/etc/profile.d/nix.sh; do
              [ -e "$p" ] && . "$p"
            done
            command -v devenv >/dev/null || { echo '  FAIL: devenv not on PATH after sourcing nix profile'; exit 1; }
            fail=0

            echo "── IS_WSL branch was taken ──"
            if grep -qi microsoft /proc/sys/kernel/osrelease; then
              echo "  running under the WSL2 kernel OK"
            else
              echo "  FAIL: not under the WSL2 kernel — the WSL path was not exercised"; fail=1
            fi

            echo "── .wslconfig reached the Windows filesystem ──"
            # The script finds the Windows profile through /mnt/c + cmd.exe
            # interop, then writes .wslconfig there. On a bare runner that file
            # does not exist yet, so its presence proves the interop worked.
            winuser="$(/mnt/c/Windows/System32/cmd.exe /c 'echo %USERNAME%' 2>/dev/null | tr -d '\r')"
            cfg="/mnt/c/Users/${winuser}/.wslconfig"
            if [ -f "$cfg" ]; then
              echo "  wrote $cfg OK"
              grep -q 'memory=' "$cfg" || { echo "  FAIL: .wslconfig has no memory pin"; fail=1; }
              grep -q 'processors=' "$cfg" || { echo "  FAIL: .wslconfig has no processor pin"; fail=1; }
            else
              echo "  FAIL: $cfg not written — Windows interop broke"; fail=1
            fi

            echo "── no TTY was handled gracefully ──"
            # start.sh must not die when /dev/tty cannot be opened; it should
            # print how to enter the shell instead. Re-run just the tail to
            # confirm the exit code is 0 rather than the exec failure it had.
            if IOI_ENV_NO_SHELL=1 bash scripts/start.sh >/dev/null 2>&1; then
              echo "  exits 0 without a TTY OK"
            else
              echo "  FAIL: start.sh exits non-zero with no TTY"; fail=1
            fi

            [ "$fail" = 0 ] || exit 1

      - name: Verify the toolchain inside WSL
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            # each wsl-bash step is a fresh non-login shell: nothing a previous
            # step exported is still set, so source the nix profile explicitly.
            for p in /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh \
                     /nix/var/nix/profiles/default/etc/profile.d/nix.sh; do
              [ -e "$p" ] && . "$p"
            done
            command -v devenv >/dev/null || { echo '  FAIL: devenv not on PATH after sourcing nix profile'; exit 1; }
            devenv shell --no-tui -- just check-env
            devenv shell --no-tui -- just check-compile
            devenv shell --no-tui -- just check-vimrc

      - name: Sanitizers stable under the WSL2 kernel
        uses: Ubuntu/WSL/.github/actions/wsl-bash@main
        with:
          distro: Ubuntu-${{ matrix.ubuntu }}
          working-dir: ~/ioi-env
          exec: |
            set -eu
            # each wsl-bash step is a fresh non-login shell: nothing a previous
            # step exported is still set, so source the nix profile explicitly.
            for p in /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh \
                     /nix/var/nix/profiles/default/etc/profile.d/nix.sh; do
              [ -e "$p" ] && . "$p"
            done
            command -v devenv >/dev/null || { echo '  FAIL: devenv not on PATH after sourcing nix profile'; exit 1; }
            # Ran as its own step rather than folded into the verify step above,
            # because WSL2 is a different kernel with a different ASLR situation
            # from a native Linux runner, and this is the run that proves
            # `setarch -R` is still load-bearing here rather than cargo-culted.
            devenv shell --no-tui -- just check-asan

  # ── the literal one-liner, straight off GitHub ──────────────────────────────
  # The WSL job clones the repo itself; this one runs the exact curl command
  # from the README, against the published branch, to prove the URL in the docs
  # really is a working one-liner and that a default install lands in
  # ~/ioi-env as documented. Only meaningful on main, where that branch is the
  # one being pushed — a PR's head ref doesn't exist on the base repo, so the
  # published-main URL would 404 for reasons unrelated to the script.
  oneliner-remote:
    name: one-liner (curl | bash) from published main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Run the README one-liner verbatim
        env:
          IOI_ENV_NO_SHELL: "1"
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/start.sh" | bash

      - name: It landed in ~/ioi-env with a working toolchain
        run: |
          test -f "$HOME/ioi-env/devenv.nix" || { echo "  FAIL: did not install to ~/ioi-env"; exit 1; }
          cd "$HOME/ioi-env"
          devenv allow
          devenv shell --no-tui -- just check-env
